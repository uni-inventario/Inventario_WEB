name: Deploy to Firebase Hosting (HML and PROD)

on:
  push:
    branches:
      - develop
      - feature/13-configuracao-firebase

jobs:
  deploy-hml:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env.production
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL_HML }}" > .env.production

      - name: Install Dependencies
        run: npm ci

      - name: Build HML
        run: npm run build

      - name: Start Frontend
        run: |
          npm run preview -- --port 5550 &
          sleep 5

      - name: Install Cypress
        run: npm install cypress start-server-and-test --save-dev

      - name: Run Cypress Tests
        env:
          CYPRESS_baseUrl: "http://localhost:5550"
        run: npm run test:e2e

      - name: Deploy to Firebase Hosting (HML)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOCKFLOW_SHOPP }}
          projectId: stockflow-shopp
          target: hml
          channelId: hml

  deploy-prod:
    if: github.ref == 'refs/heads/feature/13-configuracao-firebase'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env.production
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL_PRD }}" > .env.production

      - name: Install Dependencies
        run: npm ci

      - name: Build PROD
        run: npm run build

      - name: Deploy to Firebase Hosting (PROD)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOCKFLOW_SHOPP }}
          projectId: stockflow-shopp
          target: prod
